<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ак Барс — Новый свет mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="click-area">
    <div class="banner">
      <div class="frame frame-main">
        <img class="picture" src="images/picture.jpg" alt="">
        <div class="photo-overlay"></div>
        <div class="edge left-edge"></div>
        <div class="edge right-edge"></div>
        <img class="logo logo1" src="images/logo_1.svg" alt="" style="opacity:0;">
        <img class="logo logo2" src="images/logo_2.svg" alt="" style="opacity:0;">
        <img class="utp" src="images/utp.png" alt="" style="opacity:0;">
      </div>

      <div class="frame frame-disclaimer" style="opacity:0;">
        <div class="disclaimer" style="opacity:0;">Реклама. Рекламодатель ООО «Ак Барс Дом», ИНН 1657100885. Застройщик<br>ООО «Специализированный застройщик «Близкий». Проектные декларации<br>на наш.дом.рф. Рассрочка от застройщика. Сроки проведения акции с<br>01.08.2026 по 30.09.2026. Подробности по телефону 8 (843) 558-22-94.</div>
      </div>
    </div>
  </div>

  <script nonce="%request.eid1%">
    var flashVars = {
      reference: "%request.reference%",
      link: "%banner.user1%",
      target: "%banner.target%",
      rnd: parseInt("%request.place_random%") || parseInt("%system.random%"),
      events: ["","%banner.event1%","%banner.event2%","%banner.event3%","%banner.event4%","%banner.event5%","%banner.event6%","%banner.event7%","%banner.event8%","%banner.event9%","%banner.event10%","%banner.event11%","%banner.event12%","%banner.event13%","%banner.event14%","%banner.event15%","%banner.event16%","%banner.event17%","%banner.event18%","%banner.event19%","%banner.event20%","%banner.event21%","%banner.event22%","%banner.event23%","%banner.event24%","%banner.event25%","%banner.event26%","%banner.event27%","%banner.event28%","%banner.event29%","%banner.event30%"]
    };
  </script>
  <script nonce="%request.eid1%" type="text/javascript" src="https://banners.adfox.ru/files/adfox_HTML5.js"></script>
  <script nonce="%request.eid1%" src="script.js"></script>
</body>
</html>
