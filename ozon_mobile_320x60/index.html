<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="ad.size" content="width=320,height=60">
<title>Ozon — логистическая сеть, 320×60</title>
<link rel="stylesheet" href="style.css">
<noscript><style>.scene1{opacity:0}.scene3{opacity:1}.disclaimer3{opacity:1}</style></noscript>
</head>
<body>
<div class="click-area" role="link" aria-label="Ozon — логистическая сеть">
 <div class="banner">
  <div class="scene scene1" aria-label="Кадр 1">
   <img class="layer photo warehouse1" src="images/warehouse_frame1.png" alt="">
   <div class="layer copy headline1">Станьте частью
логистической сети Ozon</div>
  </div>
  <div class="scene scene2" aria-label="Кадр 2">
   <img class="layer photo warehouse2" src="images/warehouse_frame1.png" alt="">
   <div class="layer copy subhead2">Ищем владельцев
складов и застройщиков</div>
   <div class="layer cta2">
    <img class="button-bg2" src="images/cta_bg.svg" alt="">
    <div class="copy button-text2">Узнать подробнее</div>
   </div>
  </div>
  <div class="scene scene3" aria-label="Кадр 3">
   <img class="layer photo warehouse3" src="images/warehouse_frame1.png" alt="">
   <div class="layer copy disclaimer3">Реклама. Рекламодатель
ООО «Интернет Решения»,
ИНН 7704217370.</div>
  </div>
  <div class="tech-stripe" aria-hidden="true"></div>
 </div>
</div>
<script nonce="%request.eid1%">
var flashVars = {
 reference:"%request.reference%", link:"%banner.user1%", target:"%banner.target%",
 rnd:parseInt("%request.place_random%") || parseInt("%system.random%"),
 events:["","%banner.event1%","%banner.event2%","%banner.event3%","%banner.event4%","%banner.event5%","%banner.event6%","%banner.event7%","%banner.event8%","%banner.event9%","%banner.event10%","%banner.event11%","%banner.event12%","%banner.event13%","%banner.event14%","%banner.event15%","%banner.event16%","%banner.event17%","%banner.event18%","%banner.event19%","%banner.event20%","%banner.event21%","%banner.event22%","%banner.event23%","%banner.event24%","%banner.event25%","%banner.event26%","%banner.event27%","%banner.event28%","%banner.event29%","%banner.event30%"]
};
</script>
<script nonce="%request.eid1%" type="text/javascript" src="https://banners.adfox.ru/files/adfox_HTML5.js"></script>
<script nonce="%request.eid1%" src="script.js"></script>
</body></html>
