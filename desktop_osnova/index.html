  <script nonce="%request.eid1%">
(function () {
  var banner = document.getElementById("canvas");
  if (!banner) return;

  banner.style.cursor = "pointer";
  banner.addEventListener("click", function (event) {
    if (event.button !== 0 || typeof window.callClick !== "function") return;
    event.preventDefault();
    window.callClick();
  });
  banner.addEventListener("keydown", function (event) {
    if ((event.key !== "Enter" && event.key !== " ") || typeof window.callClick !== "function") return;
    event.preventDefault();
    window.callClick();
  });
})();
  </script>
