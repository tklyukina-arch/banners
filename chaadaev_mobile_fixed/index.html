<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="ad.size" content="width=320,height=60">
  <title>Чаадаев — HTML5 banner 320x60</title>
  <link rel="stylesheet" href="style.css">
  <script>
    var flashVars = {
      reference: "%request.reference%",
      link: "%banner.user1%",
      target: "%banner.target%",
      rnd: parseInt("%request.place_random%") || parseInt("%system.random%"),
      events: ["","%banner.event1%","%banner.event2%","%banner.event3%","%banner.event4%","%banner.event5%","%banner.event6%","%banner.event7%","%banner.event8%","%banner.event9%","%banner.event10%","%banner.event11%","%banner.event12%","%banner.event13%","%banner.event14%","%banner.event15%","%banner.event16%","%banner.event17%","%banner.event18%","%banner.event19%","%banner.event20%","%banner.event21%","%banner.event22%","%banner.event23%","%banner.event24%","%banner.event25%","%banner.event26%","%banner.event27%","%banner.event28%","%banner.event29%","%banner.event30%"]
    };
  </script>
  <script type="text/javascript" src="https://banners.adfox.ru/files/adfox_HTML5.js"></script>
</head>
<body>
  <div class="click-area">
    <main class="banner" aria-label="Рекламный баннер Чаадаев">
      <img class="photo photo-1" src="images/photo1.jpg" alt="">
      <img class="photo photo-3" src="images/photo3.jpg" alt="">
      <img class="logo-main" src="images/logo.svg" alt="Чаадаев">
      <section class="text-block frame-1-text" aria-hidden="true">
        <div class="title title-line title-green title-size-large frame-1-line frame-1-line-1">Квартиры</div>
        <div class="title title-line title-white title-size-medium frame-1-line frame-1-line-2">с видом на лес</div>
      </section>

      <section class="text-block frame-3-text" aria-hidden="true">
        <div class="description-block">
          <div class="description description-line description-line-1">Квартиры с готовой отделкой</div>
          <div class="description description-line description-line-2">кухонным гарнитуром и техникой</div>
        </div>
        <div class="price">от 2,9 млн ₽</div>
      </section>

      <section class="frame-4-text" aria-hidden="true">
        <div class="disclaimer">
          <div>Реклама. Рекламодатель ООО «Маркетинг и консалтинг»,</div>
          <div>ИНН 5835138537. Застройщик ООО СЗ «Лугометрия 11».</div>
          <div>Проектная декларация на сайте наш.дом.рф</div>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
